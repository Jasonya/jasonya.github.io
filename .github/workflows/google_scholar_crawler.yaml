name: Get Citation Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python main.py
      - name: Publish citation data
        run: |
          git fetch origin google-scholar-stats
          git worktree add --detach /tmp/scholar-stats FETCH_HEAD
          cp google_scholar_crawler/results/*.json /tmp/scholar-stats/
          cd /tmp/scholar-stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi
          git commit -m 'Update citation data'
          git push origin HEAD:google-scholar-stats
